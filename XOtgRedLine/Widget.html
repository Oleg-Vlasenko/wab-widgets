<div>
    <h2>Вибрати червоні лінії на мапі</h2>
    <div>
        <div class="select-dijit-container" data-dojo-attach-point="selectDijitNode">

            <div class="jimu-btn" data-dojo-attach-point="btnPolygon" tabindex="0"
                style="color:white; background-color:cadetblue; width: 200px;"
                data-dojo-attach-event="onclick:_onBtnPolygonClick">
                <div class="clear-text">Виділити область</div>
            </div>
            <br>
            <br>
            <div class="jimu-btn" data-dojo-attach-point="btnClear" tabindex="2"
                style="color:seagreen;background-color:azure; width: 200px;"
                data-dojo-attach-event="onclick:_onBtnClearClick">
                <div class="clear-text">Очистити виділення</div>
            </div>

        </div>

        <div class="seperator mg-separator"></div>
        <div style="margin-bottom: 30px">
            <h2>Інформація про обрану червону лінію</h2>

            <div class="jimu-btn" data-dojo-attach-event="onclick:_onBtnSelectedClick" style="color:white; background-color:cadetblue; width: 200px;">
                Отримати інформацію
            </div>
        </div>

        <div style="padding-bottom:20px; padding-left:10px;">
            <br>
            <label id="message" class="label" style="color:green;"></label>
            <div data-dojo-attach-point="layersInfoNode" style="color:blue; font-family:monospace; white-space:pre;"></div>
        </div>

    </div>

</div>
