<div>
    
    <!-- Вкладки -->
    <div class="mg-tab-bar">
        <div class="mg-tab-btn mg-active" data-tab="tab1">Накреслити трасу</div>
        <div class="mg-tab-btn" data-tab="tab2">Інформація про обрану трасу</div>
        <div class="mg-tab-btn" data-tab="tab3">Пошук траси</div>
    </div>

    <!-- Содержимое вкладки 1 -->
    <div class="mg-tab-content mg-active" id="tab1">
        <div class="jimu-btn" data-dojo-attach-point="btnPolyLine" tabindex="1"
             style="color:white; background-color:cadetblue; width: 200px;"
             data-dojo-attach-event="onclick:_onBtnPolyLineClick">
            <div class="clear-text">${nls.buttonPolyLineText}</div>
        </div>
        <br><br>
        <div class="jimu-btn" data-dojo-attach-point="btnClear" tabindex="2"
             style="color:seagreen;background-color:azure; width: 200px;"
             data-dojo-attach-event="onclick:_onBtnClearClick">
            <div class="clear-text">${nls.btnClearText}</div>
        </div>
        <div style="padding-bottom:20px; padding-left:10px;">
            <br>
            <label id="message" class="label" style="color:green;"></label>
        </div>
    </div>

    <!-- Содержимое вкладки 2 -->
    <div class="mg-tab-content" id="tab2">
        <div style="margin-bottom: 30px">
            <h2>Інформація про обрану трасу</h2>
            <div class="jimu-btn" data-dojo-attach-event="onclick:_onBtnSelectedClick" 
                 style="color:white; background-color:cadetblue; width: 200px;">
                Отримати інформацію
            </div>
        </div>
    </div>

    <!-- Содержимое вкладки 3 -->
    <div class="mg-tab-content" id="tab3">
        <div>
            <h2>Пошук траси</h2>
            <div style="margin-bottom: 6px; margin-top: 6px;">
                <span class="label">Шифр</span>
            </div>
            <div style="margin-bottom: 12px;">
                <span class="input">
                    <input style="min-width: 100%" id="mg-req-track" class="jimu-input" type="text" value="" />
                </span>
            </div>
            <div class="jimu-btn" data-dojo-attach-event="onclick:_onBtnSearchClick" 
                 style="color:white; background-color:cadetblue; width: 200px;">
                Пошук
            </div>
        </div>
        <span id="mg-srch-results-trs"></span>
    </div>

    <!-- Общий блок внизу -->
    <div class="mg-bottom-block">
        <h2>Показати полігони аналітики</h2>
        <div class="jimu-btn" data-dojo-attach-event="onclick:_onTest1Click" 
             style="color:white; background-color:cadetblue; width: 200px;">
            Показати
        </div>
    </div>

    <span id="mg-lines-template-trs" style="display:none;">
        <span class="mg-search-row" style="display: table-row; margin: 14px 0 0 0;">
            <div class="seperator mg-separator"></div>
            <div class="mg-search-block-trs">
                <span style="display: table-cell; vertical-align: middle;">
                    <span class="jimu-icon jimu-icon-search mg-search-coords" title="Знайти на карті" style="margin: 0 10px 0 0; position: relative; top: 3px;"></span>
                </span>
                <span style="display: table-cell; width: 1000px;">
                    <h3 class="mg-search-txt">link</h3>
                </span>
                <span style="display: table-cell; vertical-align: middle;">
                    <span class="jimu-icon jimu-icon-folder-open mg-run-prot" title="Відкрити дані шарів" style="margin: 0 0 0 10px;"></span>
                </span>
            </div>
        </span>
    </span>
</div>
